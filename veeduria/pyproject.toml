[project]
name = "veeduria"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "surya-ocr>=0.6",
    "transformers>=4.56,<5",
    "torch>=2.3",
    "mlx-lm>=0.15",
    "jinja2>=3.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veeduria"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
